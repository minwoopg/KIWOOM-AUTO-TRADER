# ── 스윙 전략 설정 ─────────────────────────────────────────────
# python -m app.main_swing 으로 단독 실행

app:
  env: paper
  log_level: INFO
  is_paper_trading: true

broker:
  provider: kiwoom
  use_mock: false
  base_url: https://mockapi.kiwoom.com
  app_key: ${KIWOOM_APP_KEY}
  secret_key: ${KIWOOM_SECRET_KEY}
  account_number: ${KIWOOM_ACCOUNT_NUMBER}
  is_paper_trading: true

# ── 감시 종목 (watchlist) ───────────────────────────────────────
# 조건검색 편입 + watchlist 포함 시 점수 +1 가산
swing_watchlist:
  - "005930"   # 삼성전자
  - "000660"   # SK하이닉스
  - "035420"   # NAVER
  - "035720"   # 카카오
  - "000270"   # 기아
  - "005380"   # 현대차

# ── 진입 조건 ──────────────────────────────────────────────────
swing_entry:
  enabled: true
  trade_enabled: false        # false=관찰모드 / true=실매수

  start_time: "15:10"
  end_time:   "15:20"

  max_positions: 3            # 최대 보유 종목 수
  order_cash_per_trade: 2000000  # 1회 주문금액 (200만원)

  # 기술적 조건
  ma10_distance_min_pct: -2.0   # MA10 대비 최소 거리 (%)
  ma10_distance_max_pct:  1.0   # MA10 대비 최대 거리 (%)
  require_ma20_rising: true     # MA20 상승 중 필수
  block_if_below_ma20: true     # MA20 아래 차단

  max_drawdown_from_52w_high_pct: -30.0  # 52주 고점 대비 최대 낙폭

  day_rate_min_pct: -5.0        # 당일 등락률 최소
  day_rate_max_pct:  3.0        # 당일 등락률 최대

  min_trading_value: 100000000000   # 최소 거래대금 (1,000억)
  min_volume_ratio_20d: 1.5         # 20일 평균 거래량 대비 최소 비율

  block_if_close_near_low_pct: 15.0  # 당일 저가 부근 차단 (하위 15%)

  # 2026-06-16: 눌림목-반등 패턴 보너스(+2점) 추가로 만점이 8→10점으로 변경됨.
  # min_score=7은 그대로 유지 — 기존 점수제만으로도 충족 가능한 기준을 유지하고,
  # 패턴 보너스는 "같은 점수대에서 더 우선순위 높은 후보"를 가리는 역할.
  min_score: 7                  # 최소 진입 점수 (10점 만점, 패턴보너스 포함)

  # ── 눌림목-반등 패턴 (2026-06-16 신규) ─────────────────────
  # "여러 날에 걸쳐 눌렸다가 막 반등 시작" 패턴을 별도 탐지해 보너스 점수 부여.
  # SK오션플랜트/SK이터닉스/CS윈드 같은 테마주의 며칠짜리 눌림 후 반등을
  # 일반화해서 잡기 위한 로직 (특정 종목 워치리스트가 아니라 패턴 자체를 탐지).
  enable_pullback_pattern: true
  pullback_lookback_min: 5      # 고점→저점 탐색 최소 구간 (일)
  pullback_lookback_max: 20     # 고점→저점 탐색 최대 구간 (일)
  pullback_drawdown_min_pct: -20.0  # 눌림폭 허용 하한 (더 깊은 쪽)
  pullback_drawdown_max_pct: -10.0  # 눌림폭 허용 상한 (더 얕은 쪽)
  pullback_max_trough_age_days: 1   # 저점이 오늘(0) 또는 어제(1)까지만 진입 후보
  pullback_bonus_score: 2       # 패턴 감지 시 보너스 점수

# ── 매도 조건 ──────────────────────────────────────────────────
swing_exit:
  # 기본 손절 (수익 쿠션 없음)
  no_cushion_stop_loss_pct: -5.0

  # 수익 쿠션 (+5% 이상 찍은 이후)
  cushion_trigger_profit_pct:     5.0
  cushion_partial_drawdown_pct:  -5.0   # 고점 대비 -5% → 33% 보호매도
  cushion_partial_sell_ratio:     0.33
  cushion_full_drawdown_pct:     -8.0   # 고점 대비 -8% → 전량 청산

  # 1차 부분익절
  take_profit_1_pct:        15.0
  take_profit_1_sell_ratio:  0.33

  # 익절 후 잔여 물량 청산
  after_take_profit_trailing_drawdown_pct: -7.0
  exit_if_below_daily_ma5: true

  # 기간 손절
  time_stop_days: 3
  time_stop_if_profit_below_pct: 0.0

# ── 갭하락 대응 ────────────────────────────────────────────────
swing_gap_down:
  gap_down_watch_pct:       -3.0   # 감시 시작 기준
  gap_down_immediate_pct:   -5.0   # 즉시 손절 기준
  wait_minutes_after_open:   5     # 감시 후 대기 분

# ── 로그/저장 ──────────────────────────────────────────────────
swing_storage:
  log_dir:    "logs"
  report_dir: "reports"
  app_log:    "logs/app_swing.log"
  trades_csv: "logs/swing_trades.csv"
  watch_csv:  "logs/swing_watch.csv"   # 관찰 모드 기록

# ── 카카오 알림 ────────────────────────────────────────────────
kakao:
  access_token:  "${KAKAO_ACCESS_TOKEN}"
  refresh_token: "${KAKAO_REFRESH_TOKEN}"
  rest_api_key:  "${KAKAO_REST_API_KEY}"
