app:
  name: kiwoom-auto-trader-ver1
  env: local
  log_level: INFO

broker:
  provider: kiwoom
  # true  -> 가짜 MockBroker 사용
  # false -> 실제 Kiwoom REST API 사용
  use_mock: false
  # 키움 모의투자 REST 서버
  # 실전투자로 바꿀 때는 https://api.kiwoom.com 으로 변경합니다.
  base_url: https://mockapi.kiwoom.com
  app_key: ${KIWOOM_APP_KEY}
  secret_key: ${KIWOOM_SECRET_KEY}
  account_number: ${KIWOOM_ACCOUNT_NUMBER}
  is_paper_trading: true

# 감시할 종목 목록 (조건검색 OFF 시 사용)
targets:
  symbols:
    - "010170"
    - "006260"
    - "005930"
    - "080220"
    
trading:
  poll_interval_seconds: 10
  balance_refresh_seconds: 180
  price_refresh_seconds: 60
  order_cash_per_trade: 6000000
  max_positions: 5
  allow_multiple_entries_per_symbol_per_day: false  # 동일 종목 1일 1회 진입 제한 (2026-06-15)
  force_exit_before_market_close_minutes: 20  # 15:10부터 수익쿠션 없는 포지션 강제청산
  force_exit_cushion_pct: 0.3                 # +0.3% 이상이면 이월 허용
  reentry_cooldown_seconds: 600
  trail_loss_cooldown_count: 1   # 트레일링 손실 N회 → 60분 쿨다운 (기존 2회 → 1회)
  excluded_symbols:              # 신규매수 영구 차단 종목
    - "080220"                   # 4일 연속 고위험
    - "010170"                   # 2일 연속 고위험
    - "001510"                   # 실제 손실 + 고위험
    - "001740"                   # 2일 연속 실제 손실(6/9,6/15) + 리플레이 고위험

strategy:
  name: breakout
  breakout_threshold_pct: 1.0
  take_profit_pct: 15.0          # 안전망 익절 (+15%)
  stop_loss_pct: 1.5             # 손절 기준
  reference_price_type: previous_close
  trailing_stop_pct: 2.0         # 최고가 대비 -2% 하락 시 매도
  trailing_start_pct: 1.0        # 최소 +1% 이상 올랐을 때부터 트레일링 시작
  trend_reversal_rsi: 70.0       # 추세 꺾임 감지 RSI 기준

market_regime:
  short_ma_days: 5
  long_ma_days: 20
  history_days: 50
  rsi_period: 14
  rsi_overbought: 80.0
  rsi_oversold: 20.0
  history_refresh_seconds: 3600
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  volume_surge_ratio: 1.5
  minute_tick_scope: 1
  minute_bar_count: 60
  minute_refresh_seconds: 60
  # V자 반등 감지 파라미터
  v_bottom_lookback: 30
  v_low_min_age: 1
  v_low_max_age: 8
  v_drop_threshold_pct: -2.5   # 2026-06-16: -3.0 → -2.5 완화 (V자 0건 지속, 낙폭부족 75.4%가 주원인)
  v_rebound_threshold_pct: 1.2
  v_max_rebound_pct: 6.0
  v_volume_ratio: 1.5
  v_min_bar_amount: 30000000
  v_bottom_spike_ratio: 1.5
  v_ma5_slope_bars: 3
  min_trading_value: 50000000000  # 500억 이상
  pullback_min_pct: -7.0
  pullback_max_pct: -0.3   # 완화: 고가 대비 -0.3% 이내까지 허용
  change_rate_min: 2.0
  change_rate_max: 18.0
  rebound_min_pct: 2.0

risk:
  max_daily_loss_amount: 1000000  # 일일 손실 한도 (원)
  max_consecutive_losses: 3      # 연속 손절 허용 횟수 (0=비활성)
  max_order_amount: 6000000
  min_cash_buffer: 100000

entry_watch:
  enabled: false                 # true로 변경 시 entry watch 청산 활성화
  watch_minutes: 5               # 매수 후 관찰 시간 (분)
  min_profit_pct: 0.5            # 관찰 기간 중 최소 달성 수익률 (%)
  fail_cut_pct: -1.0             # 이 손실 이하면 즉시 청산 (%)
  fail_on_vwap_break: true       # VWAP 이탈 시 청산 여부

websocket:
  enabled: true
  url: wss://api.kiwoom.com:10000/api/dostk/websocket
  condition_seqs: [1, 2, 3]   # 동시 구독할 조건식 번호 목록 (단타 3개)
  max_symbols: 10
  app_key: ${KIWOOM_REAL_APP_KEY}
  secret_key: ${KIWOOM_REAL_SECRET_KEY}

  # ── 스윙 전용 조건검색 (2026-06-16 신규) ─────────────────
  # 키움 HTS에서 직접 만든 스윙용 검색식(20일선 근처/충분히 눌린 종목)의
  # 시퀀스 번호를 여기에 추가하면, 그 결과만 별도로 분리해서
  # data/swing_condition_symbols.json에 저장 → main_swing.py가 읽어감.
  # 검색식 만들기 전까지는 빈 리스트로 둬도 안전 (스윙은 watchlist만 사용).
  swing_condition_seqs: []   # 예: [4] — 검색식 만든 후 seq 번호로 교체
  swing_condition_output: data/swing_condition_symbols.json

storage:
  state_file: data/state.json
  trade_log_file: logs/trades.csv
  signal_log_file: logs/signal_log.csv
  app_log_file: logs/app.log
  save_minute_bars: true              # 1분봉 원본 저장 여부
  minute_bars_dir: data/minute_bars   # 저장 경로

# ── 카카오톡 알림 ──────────────────────────────────────────
# .env 파일에 아래 키를 입력하세요 (.gitignore로 보호됨)
kakao:
  access_token:  "${KAKAO_ACCESS_TOKEN}"
  refresh_token: "${KAKAO_REFRESH_TOKEN}"
  rest_api_key:  "${KAKAO_REST_API_KEY}"
