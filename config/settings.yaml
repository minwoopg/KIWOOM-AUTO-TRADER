app:
  name: kiwoom-auto-trader-ver1
  env: local
  log_level: INFO

broker:
  provider: kiwoom
  # true  -> 가짜 MockBroker 사용
  # false -> 실제 Kiwoom REST API 사용
  use_mock: false
  # 키움 모의투자 REST 서버
  # 실전투자로 바꿀 때는 https://api.kiwoom.com 으로 변경합니다.
  base_url: https://mockapi.kiwoom.com
  app_key: ${KIWOOM_APP_KEY}
  secret_key: ${KIWOOM_SECRET_KEY}
  account_number: ${KIWOOM_ACCOUNT_NUMBER}
  is_paper_trading: true

# 첫 버전은 종목 수를 적게 두는 편이 디버깅에 좋습니다.
targets:
  symbols:
    - "001510"
    - "047040"

trading:
  poll_interval_seconds: 10
  balance_refresh_seconds: 180
  price_refresh_seconds: 300
  order_cash_per_trade: 200000
  max_positions: 2
  allow_multiple_entries_per_symbol_per_day: true
  force_exit_before_market_close_minutes: 10
  # 매도 후 같은 종목 재매수 차단 시간 (초)
  # 600 = 10분. 너무 짧으면 핑퐁, 너무 길면 기회를 놓침
  reentry_cooldown_seconds: 200

strategy:
  name: breakout
  breakout_threshold_pct: 1.0
  take_profit_pct: 2.0
  stop_loss_pct: 1.5
  reference_price_type: previous_close

market_regime:
  short_ma_days: 5
  long_ma_days: 20
  history_days: 60
  rsi_period: 14
  rsi_overbought: 80.0
  rsi_oversold: 20.0
  history_refresh_seconds: 3600
  # MACD 파라미터 (일반적인 표준값)
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  # 거래량 급증 기준: 최근 20일 평균 거래량의 N배 이상이면 급증으로 판단
  volume_surge_ratio: 1.5

risk:
  max_daily_loss_amount: 100000
  max_order_amount: 300000
  min_cash_buffer: 100000

websocket:
  # false: 기존 방식(수동 종목 등록)으로 동작
  # true:  조건검색으로 종목 자동 편입/편출
  enabled: false
  # 모의투자: wss://mockapi.kiwoom.com:10000/api/dostk/websocket
  # 실전투자: wss://api.kiwoom.com:10000/api/dostk/websocket
  url: wss://mockapi.kiwoom.com:10000/api/dostk/websocket
  # HTS에서 만든 조건검색식 번호 (CNSRLST로 확인 가능)
  condition_seq: 0
  # 조건검색으로 편입 가능한 최대 종목 수 (너무 많으면 API 부담)
  max_symbols: 5

storage:
  state_file: data/state.json
  trade_log_file: logs/trades.csv
  app_log_file: logs/app.log
