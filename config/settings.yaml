app:
  name: kiwoom-auto-trader-ver1
  env: local
  log_level: INFO

broker:
  provider: kiwoom
  # true  -> 가짜 MockBroker 사용
  # false -> 실제 Kiwoom REST API 사용
  use_mock: false
  # 키움 모의투자 REST 서버
  # 실전투자로 바꿀 때는 https://api.kiwoom.com 으로 변경합니다.
  base_url: https://mockapi.kiwoom.com
  app_key: ${KIWOOM_APP_KEY}
  secret_key: ${KIWOOM_SECRET_KEY}
  account_number: ${KIWOOM_ACCOUNT_NUMBER}
  is_paper_trading: true

# 감시할 종목 목록 (조건검색 OFF 시 사용)
targets:
  symbols:
    - "001510"
    - "047040"
    - "001510"
    - "047040"
    - "247540"
    - "010170"
    - "006260"
    - "005930"
    
trading:
  poll_interval_seconds: 10
  balance_refresh_seconds: 180
  price_refresh_seconds: 60
  order_cash_per_trade: 500000
  max_positions: 5
  allow_multiple_entries_per_symbol_per_day: true
  force_exit_before_market_close_minutes: 12
  reentry_cooldown_seconds: 600

strategy:
  name: breakout
  breakout_threshold_pct: 1.0
  take_profit_pct: 15.0          # 안전망 익절 (+15%)
  stop_loss_pct: 1.5             # 손절 기준
  reference_price_type: previous_close
  trailing_stop_pct: 2.0         # 최고가 대비 -2% 하락 시 매도
  trailing_start_pct: 1.0        # 최소 +1% 이상 올랐을 때부터 트레일링 시작
  trend_reversal_rsi: 70.0       # 추세 꺾임 감지 RSI 기준

market_regime:
  short_ma_days: 5
  long_ma_days: 20
  history_days: 50
  rsi_period: 14
  rsi_overbought: 80.0
  rsi_oversold: 20.0
  history_refresh_seconds: 3600
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  volume_surge_ratio: 1.5
  minute_tick_scope: 3
  minute_bar_count: 40
  minute_refresh_seconds: 180
  min_trading_value: 1000000000
  pullback_min_pct: -7.0
  pullback_max_pct: -1.0
  change_rate_min: 2.0
  change_rate_max: 18.0
  rebound_min_pct: 2.0

risk:
  max_daily_loss_amount: 100000
  max_order_amount: 300000
  min_cash_buffer: 100000

websocket:
  enabled: true
  url: wss://api.kiwoom.com:10000/api/dostk/websocket
  condition_seq: 0
  max_symbols: 10
  app_key: ${KIWOOM_REAL_APP_KEY}
  secret_key: ${KIWOOM_REAL_SECRET_KEY}

storage:
  state_file: data/state.json
  trade_log_file: logs/trades.csv
  app_log_file: logs/app.log
