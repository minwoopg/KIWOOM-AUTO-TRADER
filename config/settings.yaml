app:
  name: kiwoom-auto-trader-ver1
  env: local
  log_level: INFO

broker:
  provider: kiwoom
  # true  -> 가짜 MockBroker 사용
  # false -> 실제 Kiwoom REST API 사용
  use_mock: false
  # 키움 모의투자 REST 서버
  # 실전투자로 바꿀 때는 https://api.kiwoom.com 으로 변경합니다.
  base_url: https://mockapi.kiwoom.com
  app_key: ${KIWOOM_APP_KEY}
  secret_key: ${KIWOOM_SECRET_KEY}
  account_number: ${KIWOOM_ACCOUNT_NUMBER}
  is_paper_trading: true

# 단타/스윙 종목을 분리해서 등록합니다.
# 조건검색 OFF 시 아래 종목을 직접 사용합니다.
targets:
  # 단타 종목: 당일 매수/청산, 익절 +2~3%, 손절 -1.5%
  day_symbols:
    - "001510"
    - "047040"
    - "010170"
  # 스윙 종목: 수일~수주 보유, 익절 +10~15%, 손절 -5%
  swing_symbols: []

trading:
  poll_interval_seconds: 10
  balance_refresh_seconds: 180
  price_refresh_seconds: 300
  order_cash_per_trade: 200000
  max_positions: 5             # 단타 2 + 스윙 3
  max_day_positions: 2         # 단타 최대 보유 종목
  max_swing_positions: 3       # 스윙 최대 보유 종목
  allow_multiple_entries_per_symbol_per_day: true
  force_exit_before_market_close_minutes: 10
  reentry_cooldown_seconds: 600

strategy:
  name: breakout
  breakout_threshold_pct: 1.0
  take_profit_pct: 2.0
  stop_loss_pct: 1.5
  reference_price_type: previous_close

swing:
  take_profit_pct: 12.0        # 익절 기준 (+12%)
  stop_loss_pct: 5.0           # 손절 기준 (-5%)
  weekly_history_weeks: 20     # 주봉 조회 주수
  weekly_refresh_seconds: 7200 # 주봉 캐시 갱신 주기 (2시간)
  # 주봉 장세 판단 파라미터
  short_ma_weeks: 5            # 단기 이동평균 (5주)
  long_ma_weeks: 20            # 장기 이동평균 (20주)

market_regime:
  short_ma_days: 5
  long_ma_days: 20
  history_days: 30
  rsi_period: 14
  rsi_overbought: 80.0
  rsi_oversold: 20.0
  history_refresh_seconds: 3600
  # MACD 파라미터 (일반적인 표준값)
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  # 거래량 급증 기준: 최근 20일 평균 거래량의 N배 이상이면 급증으로 판단
  volume_surge_ratio: 1.5

risk:
  max_daily_loss_amount: 100000
  max_order_amount: 300000
  min_cash_buffer: 100000

websocket:
  enabled: true
  # 실전 서버 URL (조건검색은 실전 계좌로)
  url: wss://api.kiwoom.com:10000/api/dostk/websocket
  condition_seq: 0
  max_symbols: 5
  # 조건검색 전용 실전 계좌 키 (.env에서 로드)
  app_key: ${KIWOOM_REAL_APP_KEY}
  secret_key: ${KIWOOM_REAL_SECRET_KEY}

storage:
  state_file: data/state.json
  trade_log_file: logs/trades.csv
  app_log_file: logs/app.log
